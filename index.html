s:z(1*M)}]})]},{id:"u_devon",name:"Devon Price",headline:"Operations Intern, Metro Women's Hockey",role:"Operations & Management",city:"Boston",state:"MA",mentor:!1,years:1,bio:"Game-day ops and spreadsheets.",interests:["Operations","Events"],goals:[hr("g_devon1","long","Run game-day ops for a full home stand",[["Shadow ops lead",!0],["Own the volunteer schedule",!0],["Lead a pregame briefing",!1]],{cheers:["u_sarah"]})]},{id:"u_rachel",name:"Rachel Kim",headline:"Team Operations Coordinator",role:"Operations & Management",city:"Austin",state:"TX",mentor:!1,years:3,bio:"Logistics for a pro soccer club.",interests:["Operations"],goals:[]},{id:"u_sam",name:"Sam Okafor",headline:"Sophomore, Communications",role:"Student",city:"Atlanta",state:"GA",mentor:!1,years:0,bio:"Learning the ropes.",interests:["Journalism","Video"],goals:[]}],jh=()=>[{id:"j1",title:"Graphic Designer",company:"Her Game Plan",hgp:!0,location:"New York, NY",remote:!1,type:"Full-time",pay:"$50K–$60K/yr",ts:z(7*M),tags:["Design","Branding","Illustration","Photoshop","Social Media"],postedBy:"u_carla",interested:5,desc:"Shape the visual identity of the network built by and for women in sports. You'll design campaign assets, app marketing, event collateral, and social content that feels bold and welcoming.",reqs:["1–3 years of professional or freelance design experience","Fluency in Photoshop, Illustrator, and Figma","A portfolio that shows range and a clear point of view","Passion for women's sports and community"]},{id:"j2",title:"Jr. Graphic Designer",company:"Promotion Media",location:"Brooklyn, NY",remote:!1,type:"Full-time",pay:"$50K/yr",ts:z(3*M),tags:["Design","Entry Level","Social Media","Photoshop"],postedBy:"u_ecarter",interested:3,desc:"Support our creative team producing promotional graphics for sports and entertainment clients. Great first role for a recent grad who loves fast turnarounds.",reqs:["Degree or equivalent experience in graphic design","Photoshop and Illustrator","Comfortable ts","Marketing","Entry Level"],postedBy:"u_olivia",interested:9,desc:"Own day-to-day social for a growing pro hockey club: game-day content, player features, and community storytelling.",reqs:["Experience running social accounts","Photo and short-form video editing","Willing to work some nights and weekends"]},{id:"j8",title:"Brand Design Intern",company:"Courtside Collective",location:"Remote",remote:!0,type:"Internship",pay:"$20/hr",ts:z(4*M),tags:["Design","Branding","Internship","Remote"],postedBy:"u_nina",interested:7,desc:"Remote internship supporting brand refreshes for women-led sports startups. Mentorship from senior designers included.",reqs:["Currently enrolled or recent grad","Portfolio with at least two projects","Reliable internet and a creative curiosity"]},{id:"j9",title:"Content Producer",company:"Ridge Sports Network",location:"Remote",remote:!0,type:"Freelance",pay:"$35–$55/hr",ts:z(6*M),tags:["Video","Content Creation","Journalism","Remote","Sports"],postedBy:"u_emily",interested:5,desc:"Freelance producer for features and short-form video on women's sports across North America.",reqs:["Shooting and editing experience","Story instincts","Quick turnaround"]},{id:"j10",title:"Partnerships Associate",company:"Summit Athletics",location:"Philadelphia, PA",remote:!1,type:"Full-time",pay:"$55K/yr",ts:z(9*M),tags:["Sponsorship","Marketing","Events","Sports"],postedBy:"u_isabella",interested:8,desc:"Support the partnerships team activating sponsors across a multi-sport athletic department.",reqs:["Strong writing and organization","Interest in sponsorship and events","Bachelor's degree"]}],kh=()=>[{id:"a1",cat:"Wellness",read:5,photo:gh,authorId:"u_sarah",title:"Balancing Work and Wellness: Self-Care Tips for Women in Sports Careers",author:"Sarah Johnson",role:"Head Athletic Trainer | USA Women's Basketball",excerpt:"Sarah Johnson, Head Athletic Trainer for the USA Women's National Basketball Team, provides tips for managing the stress and physical demands of the sports industry while maintaining a healthy work-life balance.",blocks:[{p:"Working in professional sports, especially as a woman, can be incredibly rewarding, but it's also a fast-paced, high-pressure environment. When you're constantly managing players' injuries, coordinating team schedules, and attending to the needs of high-performance athletes, it can be easy to neglect your own wellness."},{p:"In this article, I'll discuss my journey to finding balance between my career and personal well-being, along with practical self-care strategies that can be applied to any woman working in the sports industry."},{h:"Prioritize Physical Activity",p:"I've always been active, but working in a physically demanding environment has sometimes made it difficult to prioritize my own fitness. As an athletic trainer, my days revolve around physical care for the players, so it's easy to forget my own body. Whether it's a morning walk or a restorative yoga session before bed, physical activity helps me recharge. It's easy to skip out on self-care when your job demands so much of you, but I've found that investing in my health ultimately helps me perform better at work, too."},{h:"Set Boundaries",p:`Another critical aspect of wellness is setting boundaries, which I've struggled with throughout my career. In sports, especially in the competitive environment of professional basketball, there's often an unspoken expectation to be "on" 24/7. But I've learned that constantly saying "yes" to every request, whether from coaches or players, leads to burnout.

Setting clear boundaries around work hours and learning to say "no" has been one of the most effective strategies I've used to protect my well-being. This might mean turning off emails after hours or scheduling "me time" on my calendar.`},{h:"Mental Health Matters",p:`The mental and emotional side of wellness is just as important as physical health. The stress of working in sports can sometimes feel overwhelming, and I've realized that taking care of my mental health is crucial.

For me, journaling and talking with a therapist has been extremely helpful in managing work-related stress. A lot of the time, I don't realize how much tension I'm carrying until I take a moment to reflect. Being able to process emotions and thoughts outside of the workplace has helped me maintain a healthier perspective.`},{h:"Build a Support System",p:`Having a network of women who understand the unique challenges I face in sports has been invaluable. I've found support through other women in similar roles, and I try to be that support for others as well. Whether it's swapping advice on how to manage stress or simply sharing experiences, having these relationships makes a huge difference.

Ultimately, self-care isn't a luxury — it's a necessity. By prioritizing my health and setting boundaries, I'm not only better equipped to handle the demands of my job, but I'm also setting a positive example for the players I work with.`}],comments:[{id:"ac1",authorId:"u_maria",text:"The boundaries section hit home. Needed this today.",ts:z(2*Ne)},{id:"ac2",authorId:"u_devon",text:"Starting a journaling habit tonight because of this.",ts:z(5*Ne)}]},{id:"a2",cat:"Branding",read:4,authorId:"u_olivia",title:"Building a Personal Brand in Sports: How to Stand Out and Get Noticed",author:"Olivia Carter",role:"Sports Marketing Manager | Sports Apparel Company",excerpt:"Olivia Carter, Sports Marketing Manager for a Sports Apparel Company, discusses ways to create a strong personal brand through social media, networking, and showcasing expertise.",blocks:[{p:"Your personal brand is how the industry remembers you before you're even in the room. The good news: you don't need a huge following. You need a clear point of view and consistency."},{h:"Get specific",p:'Finish this sentence: "I help ___ by ___." Women who are known for something specific, like game-day content, analytics, or athlete storytelling, get the call when that need comes up.'},{h:"Treat social like a portfolio in motion",p:"Post the work, and the process behind it. Share a lesson from a project, a takeaway from a panel, or a behind-the-scenes look at your craft. Two thoughtful posts a week beats a daily scramble."},{h:"Network in real time",p:"Every conversation, DM, or panel question is a chance to reinforce what you stand for. Follow up within 48 hours with something useful: an article, an intro, a specific compliment."},{h:"Share expertise generously",p:"Sharing what you know builds trust faster than any resume line. Answer questions in communities like this one, and you'll be surprised who's watching."}],comments:[{id:"ac3",authorId:"u_nina",text:"Great breakdown, saving this for later.",ts:z(1*M)}]},{id:"a3",cat:"Career",read:4,authorId:"u_isabella",title:"From Fan to Pro: How to Transition from a Passion for Sports to a Career",author:"Isabella Tran",role:"Marketing Manager | Sports Sponsorship",excerpt:"Isabella Tran, Marketing Manager in Sports Sponsorship, guides women on how to leverage their love of sports into a meaningful and successful career, whether in management, media, coaching, or behind-the-scenes.",blocks:[{p:"Loving a sport and building a career around it are two different skill sets, and the second one is learned on purpose."},{h:"Map the roles you don't see on TV",p:"Sponsorship, operations, analytics, content, community, partnerships, ticketing. Most entry points live behind the scenes. Browse job boards by function, not just by team."},{h:"Get proximity early",p:"Volunteer at events, intern relentlessly, and say yes to the unglamorous shifts. Proximity teaches you the industry's language faster than any course."},{h:"Turn fandom into insight",p:"Your fandom is an asset. You understand what fans want. Translate that into pitches: a campaign idea, a content series, a better game-day moment."},{h:"Ask for 15 minutes",p:`People in this industry remember who helped them. A specific, short ask ("Could I get 15 minutes of your advice on breaking into partnerships?") gets a yes more often than you'd think.`}],comments:[{id:"ac4",authorId:"u_sam",text:"Wish I'd read this before applying to internships!",ts:z(3*M)}]},{id:"a4",cat:"Confidence",read:5,authorId:"u_jevans",title:"Workplace Confidence: How to Speak Up and Own Your Space in Male-Dominated Environments",author:"Jessica Evans",role:"Head Coach | D1 NCAA Men's Basketball Team",excerpt:"Jessica Evans, Head Coach of a D1 NCAA Men's Basketball Team, offers tips for cultivating confidence and assertiveness, from negotiating salaries to contributing ideas in meetings.",blocks:[{p:"Confidence in rooms that weren't built with you in mind is a practiced skill, not a personality trait you either have or don't."},{h:"Prepare your first sentence",p:"Knowing exactly how you'll start removes the hesitation of speaking up. Write down your point before the meeting and plan to speak in the first ten minutes."},{h:"Negotiate like it's part of the job",p:"Because it is. Come with market data and a specific number, not apologies. Practice out loud with a mentor or friend before the real conversation."},{h:"Don't shrink the ask",p:`Cut filler like "just" and "sorry, but." Say "I recommend" or "I'd like to propose." Direct isn't rude. It's respected.`},{h:"Take space, make space",p:"Every time you take up space well, you make it a little easier for the next woman in the room. Then hold the door: credit others' ideas out loud and sponsor someone coming up behind you."}],comments:[{id:"ac5",authorId:"u_priya",text:`"Negotiate like it's part of the job." Needed to hear that.`,ts:z(6*Ne)},{id:"ac6",authorId:"u_rachel",text:"Sharing this with my whole team.",ts:z(1*M)}]}],_={series:"Journey to Today",name:"Emily Parker",personId:"u_emily",role:"Sports Reporter",location:"Toronto, Ontario",title:"Sports Reporter: Day in My Life",length:192,photo:jd,blurb:"In the Video of the Week, Emily Parker, a rising star in sports reporting and content creation, shares her journey from breaking into the male-dominated sports media world to becoming a trusted voice in the industry. She discusses the challenges, the breakthroughs, and the key moments that shaped her career, offering valuable insights and advice for anyone looking to carve their own path in sports journalism. Whether you're passionate about sports or pursuing a career in media, Emily's story is a must-watch for motivation and practical tips.",chapters:[[0,"Breaking into the press box"],[58,"Finding your voice on camera"],[121,"Advice for your first year"],[170,"Where to start this week"]]},wh=()=>[{id:"p1",authorId:"u_maria",type:"win",ts:z(3*Ne),text:"Just got an interview with a pro women's soccer club for their marketing interns
