function Wave({ flip = false, style = {} }) {

}

      <circle cx="18" cy="80" r="4" stroke={color} strokeWidth="2" fill="none" opacity="0.8" />
    </svg>
  );
}

function Ring({ current, total, size = 108, label }) {
  const r = size / 2 - 8;
  const c = 2 * Math.PI * r;
  const pct = total === 0 ? 0 : Math.min(current / total, 1);
  return (
    <svg width={size} height={size}>
      <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,0.28)" strokeWidth="7" fill="none" />
      <circle
        cx={size / 2} cy={size / 2} r={r}
        stroke="#fff" strokeWidth="7" fill="none"
        strokeDasharray={c}
        strokeDashoffset={c - pct * c}
        strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`}
        style={{ transition: "stroke-dashoffset 0.35s ease" }}
      />
      <text x="50%" y="47%" textAnchor="middle" fill="#fff" fontFamily="Montserrat" fontWeight="800" fontSize={size * 0.24} dominantBaseline="middle">
        {label}
      </text>
    </svg>
  );
}

function GoalsScreen({ goals, setGoals, go }) {
  const [tab, setTab] = useState("short");
  const g = goals[tab];
  const done = g.steps.filter((s) => s.done).length;
  const total = g.steps.length;

  const adjust = (delta) => {
    setGoals((prev) => {
      const steps = [...prev[tab].steps];
      if (delta > 0) {
        const idx = steps.findIndex((s) => !s.done);
        if (idx !== -1) steps[idx] = { ...steps[idx], done: true };
      } else {
        for (let i = steps.length - 1; i >= 0; i--) {
          if (steps[i].done) { steps[i] = { ...steps[i], done: false }; break; }
        }
      }
      return { ...prev, [tab]: { ...prev[tab], steps } };
    });
  };

  const toggleStep = (id) => {
    setGoals((prev) => ({
      ...prev,
      [tab]: { ...prev[tab], steps: prev[tab].steps.map((s) => (s.id === id ? { ...s, done: !s.done } : s)) },
    }));
  };

  const togglePublic = () => {
    setGoals((prev) => ({ ...prev, [tab]: { ...prev[tab], isPublic: !prev[tab].isPublic } }));
  };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      <div style={{ background: C.cream }}>
        <TopBar title="Reach Your Goals!" />
        <Wave />
      </div>
      <div style={{ flex: 1, background: C.blitz, overflowY: "auto", padding: "18px 22px 24px" }}>
        <div style={{ display: "flex", justifyContent: "center", gap: 26, marginBottom: 18 }}>
          {["short", "long"].map((k) => (
            <button key={k} onClick={() => setTab(k)} style={{
              background: "none", border: "none", cursor: "pointer",
              fontFamily: "Montserrat", fontWeight: 800, fontSize: 12.5, letterSpacing: 0.6,
              color: "#fff", opacity: tab === k ? 1 : 0.55,
              borderBottom: tab === k ? "2px solid #fff" : "2px solid transparent", paddingBottom: 4,
            }}>
              {goals[k].label}
            </button>
          ))}
        </div>

        <div style={{ textAlign: "center", fontFamily: "Montserrat", fontWeight: 800, fontSize: 19, color: "#fff", marginBottom: 20 }}>{g.title}</div>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 20, marginBottom: 24 }}>
          <button onClick={() => adjust(-1)} style={circleBtn}><Minus size={18} color="#fff" /></button>
          <Ring current={done} total={total} size={116} label={tab === "short" ? `${done}/${total}` : `${total - done}`} />
          <button onClick={() => adjust(1)} style={circleBtn}><Plus size={18} color="#fff" /></button>
        </div>
        {tab === "long" && (
          <div style={{ textAlign: "center", fontFamily: "Montserrat", fontSize: 11, color: "rgba(255,255,255,0.8)", marginTop: -14, marginBottom: 18 }}>tasks left</div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 9, marginBottom: 20 }}>
          {g.steps.map((s) => (
            <label key={s.id} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
              <span onClick={() => toggleStep(s.id)} style={{
                width: 18, height: 18, borderRadius: 4, border: "2px solid #fff",
                display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
                background: s.done ? "#fff" : "transparent",
              }}>
                {s.done && <Check size={13} color={C.blitz} strokeWidth={3.5} />}
              </span>
              <span style={{ fontFamily: "Montserrat", fontSize: 13, color: "#fff", textDecoration: "underline", textDecorationColor: "rgba(255,255,255,0.5)" }}>{s.label}</span>
            </label>
          ))}
        </div>

        <div style={{ textAlign: "center", fontFamily: "Montserrat", fontSize: 11.5, color: "rgba(255,255,255,0.85)", marginTop: 12 }}>
          <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 6 }}>
            {g.isPublic ? <Globe2 size={13} /> : <Lock size={13} />}
            This goal is currently {g.isPublic ? "PUBLIC" : "PRIVATE"}.
          </div>
          <div onClick={togglePublic} style={{ fontWeight: 800, textDecoration: "underline", marginTop: 4, cursor: "pointer" }}>
            Switch to {g.isPublic ? "Private" : "Public to open discussion"}
          </div>
          {g.isPublic && (
            <div onClick={() => go("messages")} style={{ fontWeight: 800, textDecoration: "underline", marginTop: 10, cursor: "pointer" }}>
              View Discussion
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function HerGamePlanApp() {
  const [screen, setScreen] = useState("welcome");
  const [authMode, setAuthMode] = useState("signin");
  const [user, setUser] = useState({ firstName: "Emma", lastName: "Wilson", email: "emma@emmagraphics.com" });
  const [goals, setGoals] = useState(initialGoals);
  const [interests, setInterests] = useState(currentInterests);
  const [savedJobs, setSavedJobs] = useState(new Set());
  const [selectedArticle, setSelectedArticle] = useState(articles[0]);
  const [selectedJob, setSelectedJob] = useState(null);

  const go = (next, payload = {}) => {
    if (payload.mode) setAuthMode(payload.mode);
    if (payload.article) setSelectedArticle(payload.article);
    if (payload.job !== undefined) setSelectedJob(payload.job);
    setScreen(next);
  };

  const toggleSave = (id) => {
    setSavedJobs((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const showNav = !["welcome", "auth"].includes(screen);

  let body;
  switch (screen) {
    case "welcome": body = <WelcomeScreen go={go} />; break;
    case "auth": body = <AuthScreen mode={authMode} setMode={setAuthMode} go={go} setUser={setUser} />; break;
    case "home": body = <HomeScreen user={user} go={go} goals={goals} />; break;
    case "goals": body = <GoalsScreen goals={goals} setGoals={setGoals} go={go} />; break;
    case "jobs": body = <JobsScreen go={go} interests={interests} setInterests={setInterests} savedJobs={savedJobs} toggleSave={toggleSave} />; break;
    case "jobProfile": body = <JobProfileScreen go={go} job={selectedJob} user={user} />; break;
    case "jobSubmitted": body = <JobSubmittedScreen go={go} />; break;
    case "tips": body = <TipsScreen go={go} />; break;
    case "articleDetail": body = <ArticleDetailScreen article={selectedArticle} go={go} />; break;
    case "messages": body = <MessagesScreen go={go} />; break;
    default: body = <WelcomeScreen go={go} />;
  }

  return (
    <div style={{ minHeight: "100vh", background: "#EDEAF2", display: "flex", alignItems: "center", justifyContent: "center", padding: "20px 0", fontFamily: "Montserrat" }}>
      <style>{FONT}</style>
      <div style={{
        width: 390, height: 780, maxWidth: "100vw", maxHeight: "100vh",
        background: C.cream, borderRadius: 34, overflow: "hidden",
        boxShadow: "0 30px 60px rgba(35,20,50,0.35)", display: "flex", flexDirection: "column",
        border: "8px solid #17101f",
      }}>
        <div style={{ flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
          {body}
        </div>
        {showNav && <NavBar screen={screen} go={go} />}
      </div>
    </div>
  );
}
